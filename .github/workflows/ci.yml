name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-change:
    if: github.event_name == 'push'
    uses: ./.github/workflows/version-change.yml
  build:
    needs: version-change
    if: >-
      ${{ !cancelled() && (github.event_name != 'push' ||
          needs.version-change.outputs.increased == 'false') }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Validate, test and build Windows
        shell: pwsh
        run: ./Build.ps1
      - name: Exercise 25-minute PCM import in RAM and on disk
        shell: pwsh
        run: dotnet run --project tools/audio-tests -c Release
