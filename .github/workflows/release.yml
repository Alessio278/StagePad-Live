name: Publish stable Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify release version and notes
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content 'StagePad.App/StagePad.App.csproj')).Project.PropertyGroup.Version
          $tag = "v$version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable semantic version required.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and source versions differ.' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF_NAME -ne 'main') { throw 'Run stable publication from main.' }
          if (-not (Test-Path "docs/releases/$tag.md")) { throw 'Release notes missing.' }
          $existing = git tag --list $tag
          if ($existing) {
            $commit = git rev-list -n 1 $tag
            if ($commit.Trim() -ne $env:GITHUB_SHA) { throw 'Existing tag points to another commit.' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Validate, test, build and run native Windows checks
        shell: pwsh
        run: ./Build.ps1
      - name: Prepare source archive and checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $source = "artifacts/StagePad-Live-${env:RELEASE_VERSION}-Source.zip"
          git archive --format=zip --prefix="StagePad-Live-${env:RELEASE_VERSION}/" --output=$source HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
          $assets = @('artifacts/win-x64/StagePad.exe','artifacts/RELEASE-CHECKS.md') + @(Get-ChildItem 'artifacts/*-Windows.zip','artifacts/*-Source.zip' | ForEach-Object { $_.FullName })
          $lines = foreach ($file in $assets) { "{0}  {1}" -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(),(Split-Path $file -Leaf) }
          $lines | Set-Content 'artifacts/SHA256.txt' -Encoding utf8NoBOM
      - name: Publish stable latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $existing = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft) { throw 'A published release already exists; refusing to overwrite it.' }
          $assets = @('artifacts/win-x64/StagePad.exe','artifacts/SHA256.txt','artifacts/RELEASE-CHECKS.md') + @(Get-ChildItem 'artifacts/*-Windows.zip','artifacts/*-Source.zip' | ForEach-Object { $_.FullName })
          if ($existing) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --draft --title "StagePad Live $env:RELEASE_VERSION" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest --title "StagePad Live $env:RELEASE_VERSION" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'Stable publication failed.' }
