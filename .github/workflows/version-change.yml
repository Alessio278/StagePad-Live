name: Compare application versions
on:
  workflow_call:
    outputs:
      increased:
        value: ${{ jobs.version-change.outputs.increased }}
permissions:
  contents: read
jobs:
  version-change:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      increased: ${{ steps.compare.outputs.increased }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: compare
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 tools/release-version.py
