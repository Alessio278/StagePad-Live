name: Bug report / Segnalazione / Informe / Rapport
description: Report a reproducible problem in Italian, English, Spanish or French.
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: StagePad version
      placeholder: e.g. 0.12.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Passaggi / Pasos / Étapes
      description: Include actual behavior and the result you expected.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows, audio and MIDI devices
      description: Include Windows version, screen scaling, audio driver, MIDI ports and receiving device/firmware when relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach only what is useful, removing private file paths or personal details when appropriate.
